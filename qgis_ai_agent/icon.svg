<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sMap1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sMap2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="sMap3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="sDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#sDrop)">
    <!-- Folded Map (3 Panels) -->
    <!-- Left Panel -->
    <polygon points="6,20 23,13 23,51 6,58" fill="url(#sMap1)" stroke="#0369a1" stroke-width="1" stroke-linejoin="round" />
    <path d="M6,34 Q 14,32 23,28" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M6,46 Q 14,44 23,40" fill="none" stroke="#bae6fd" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

    <!-- Center Panel -->
    <polygon points="23,13 41,20 41,58 23,51" fill="url(#sMap2)" stroke="#0f766e" stroke-width="1" stroke-linejoin="round" />
    <path d="M23,28 Q 32,32 41,34" fill="none" stroke="#99f6e4" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M23,40 Q 32,44 41,46" fill="none" stroke="#99f6e4" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

    <!-- Right Panel -->
    <polygon points="41,20 58,13 58,51 41,58" fill="url(#sMap3)" stroke="#047857" stroke-width="1" stroke-linejoin="round" />
    <path d="M41,34 Q 50,30 58,28" fill="none" stroke="#a7f3d0" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M41,46 Q 50,42 58,40" fill="none" stroke="#a7f3d0" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

    <!-- Compass / Pin Node on Center Fold -->
    <circle cx="32" cy="35" r="4.5" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
    <circle cx="32" cy="35" r="2" fill="#0284c7" />
  </g>

  <!-- Radiant AI Spark (Top Right Crest) -->
  <g transform="translate(48, 12)">
    <circle cx="0" cy="0" r="6" fill="#fef08a" opacity="0.4" />
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="url(#sSpark)" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>

  <!-- Secondary Spark (Top Left) -->
  <g transform="translate(12, 12)">
    <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="#38bdf8" />
    <circle cx="0" cy="1" r="1" fill="#ffffff" />
  </g>
</svg>